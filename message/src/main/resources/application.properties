spring.application.name=message
server.port=8081
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5434/${POSTGRES_DB2}
spring.datasource.username=${POSTGRES_MESSAGE}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8080}
presence.service.url=${PRESENCE_SERVICE_URL:http://localhost:8083}

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}


rateLimiter.bucketCapacity=20
rateLimiter.refillRate=2